automation:
  methods:
    - method: agent
      models: ["Gemini"]
      framework: "Google internal coding agent"
      tool_setup: "AI-assisted: an LLM coding agent wrote most Lean proofs under human direction; Lean 4 / Lake / Mathlib v4.35.0"
      cost:
        wall_time: "several weeks of part-time work"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The mathematical argument and its informal write-up were developed by the author with AI
    assistance; the Lean development was written largely by an AI coding agent directed by the
    author, who designed the statements, reviewed the trust boundary and checked the results with
    lake comparator.

fidelity:
  divergences: >-
    Bařina's 2^71 verification is a computer result that is not formalized; it enters only as the
    explicit hypothesis hB. The m-cycle theorem covers m ≤ 91; the larger range m ≤ 100 of the
    accompanying write-up relies on native_decide certificates and is not part of this submission.

review:
  status: "author-verified"
  reviewers:
    - "Moritz Firsching (build and statement audit of the full development)"
  notes: >-
    Moritz Firsching rebuilt the full development (m ≤ 100 version) and audited that the m-cycle
    theorems match the IsMCycle specification and contain no environment hacks. The submitted
    statements were checked with lake comparator against the Lean kernel, NanoDa and con-ron.

alignment:
  namespace: "CollatzMCycles"
  statements:
    - source: "Self-contained symmetric multipoint Padé terminal linear-form bound (accompanying write-up, Lemma 3.7)"
      lean: "CollatzMCycles.Diophantine.terminal"
      module: "CollatzMCycles.Diophantine.Terminal"
      status: "proved"
      note: "New explicit linear-form bound replacing Rhin (1987); proved from Mathlib with no sorry and no native_decide."
    - source: "Hercher (2023), main theorem (no non-trivial Collatz m-cycles for m ≤ 91), proved independently via the accompanying write-up"
      lean: "CollatzMCycles.not_isMCycle_of_le_91_of_barina"
      module: "CollatzMCycles.Le91"
      status: "proved"
      note: "Independently proves Hercher's (2023) m ≤ 91 bound (conditional on Bařina's 2^71 verification, stated as the explicit hypothesis hB) via the 2-adic unimodular reduction and CollatzMCycles.Diophantine.terminal, without Hercher's finite search or Rhin's (1987) bound."
    - source: "Every element of a non-trivial cycle exceeds 2^71 (accompanying write-up, external input E1 applied to cycles)"
      lean: "CollatzMCycles.two_pow_71_lt_iterate"
      module: "CollatzMCycles.Orbit"
      status: "proved"
      note: "Supporting statement; conditional on the same hypothesis hB."
    - source: "Every m-cycle has m ≥ 1"
      lean: "CollatzMCycles.IsMCycle.ne_zero"
      module: "CollatzMCycles.Blocks"
      status: "proved"
      note: "Supporting statement about the definition IsMCycle."
    - source: "The trivial cycle 1 → 2 → 1 is a 1-cycle through 1"
      lean: "isMCycle_one_one"
      module: "CollatzMCycles.Trivial"
      status: "proved"
      note: "Test of the definition IsMCycle, from Moritz Firsching's specification."
    - source: "The trivial cycle 1 → 2 → 1 is a 1-cycle through 2"
      lean: "isMCycle_one_two"
      module: "CollatzMCycles.Trivial"
      status: "proved"
      note: "Test of the definition IsMCycle, from Moritz Firsching's specification."

